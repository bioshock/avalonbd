<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Avalon Corporation — Nature Powered. Tech Driven. Rooted in Rajshahi, Bangladesh."
    />
    <meta name="theme-color" content="#0d1418" />
    <title>Avalon Corporation</title>
    <link rel="preload" href="assets/avalon-logo.png" as="image" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <div class="ambient ambient-one" aria-hidden="true"></div>
      <div class="ambient ambient-two" aria-hidden="true"></div>

      <section class="hero" aria-labelledby="brand-title">
        <p class="eyebrow">Rajshahi · Bangladesh</p>
        <img
          class="logo"
          src="assets/avalon-logo.png"
          alt="Avalon Corporation"
          width="1148"
          height="1063"
        />
        <div class="copy">
          <h1 id="brand-title">Nature Powered.<br />Tech Driven.</h1>
          <p>
            A long-term company shaping considered ventures where nature,
            enterprise, and technology meet.
          </p>
        </div>
      </section>

      <footer>
        <span>Avalon Corporation</span>
        <span class="dot" aria-hidden="true"></span>
        <span>Building towards 2050</span>
      </footer>
    </main>
  </body>
</html>
